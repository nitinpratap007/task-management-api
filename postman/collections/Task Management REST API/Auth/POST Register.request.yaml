$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test User",
      "email": "testuser@example.com",
      "password": "TestPass123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Register returns user and token", function () {
          var data = pm.response.json();
          pm.expect(data.success).to.eql(true);
          pm.expect(data.data.user).to.not.be.undefined;
          pm.expect(data.data.token).to.not.be.undefined;
          pm.expect(data.data.user.password).to.be.undefined;
      });
      pm.test("Password hash is not returned", function () {
          var data = pm.response.json();
          pm.expect(data.data.user.password_hash).to.be.undefined;
      });
    language: text/javascript
order: 1000
